name: python CI pipline

on: 
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  test:
    name: RUN python test

    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

  build:
    name: run build job
    runs-on: ubuntu-latest
    steps:
      - name: print build message
        run: echo "Build job is running"
